# Plantilla nginx (procesada por envsubst al arrancar el contenedor).
# ${FRONTEND_PORT}, ${BACKEND_HOST} y ${BACKEND_PORT} se inyectan por entorno.

server {
    listen ${FRONTEND_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API al backend (sin URI en proxy_pass → conserva /api/…).
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta no-API cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
